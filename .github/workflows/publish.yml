name: Publish gateway image

# Builds the gateway server (back/) and pushes it to ghcr.io/<owner>/aw-mcp-gateway.
# The workflow-scoped GITHUB_TOKEN provides packages:write, so no external
# credential is needed. Manual trigger only (no automatic GHA runs — cost/
# quota conscious, mirrors tekflox/aw-app-browser's build.yml).
#
#   gh workflow run publish.yml                        # amd64
#   gh workflow run publish.yml -f include_arm64=true  # + linux/arm64 (QEMU)
on:
  workflow_dispatch:
    inputs:
      include_arm64:
        description: 'Also build linux/arm64 (QEMU emulation; slower)'
        type: boolean
        default: false

concurrency:
  group: publish-aw-mcp-gateway-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: aw-mcp-gateway
    runs-on: [self-hosted, aw-baremetal]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ghcr.io rejects mixed-case namespaces — lowercase the owner login.
      - name: Lowercase repo owner
        id: owner
        run: echo "lc=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Resolve platforms
        id: plat
        run: |
          if [ "${{ inputs.include_arm64 }}" = "true" ]; then
            echo "platforms=linux/amd64,linux/arm64" >> "$GITHUB_OUTPUT"
          else
            echo "platforms=linux/amd64" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: back
          file: back/Dockerfile
          platforms: ${{ steps.plat.outputs.platforms }}
          push: true
          tags: |
            ghcr.io/${{ steps.owner.outputs.lc }}/aw-mcp-gateway:latest
            ghcr.io/${{ steps.owner.outputs.lc }}/aw-mcp-gateway:${{ github.sha }}
          cache-from: type=registry,ref=ghcr.io/${{ steps.owner.outputs.lc }}/aw-mcp-gateway:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ steps.owner.outputs.lc }}/aw-mcp-gateway:buildcache,mode=max

      - name: Summary
        run: |
          {
            echo "## 🐳 aw-mcp-gateway pushed"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| **Image** | \`ghcr.io/${{ steps.owner.outputs.lc }}/aw-mcp-gateway:latest\` |"
            echo "| **Platforms** | ${{ steps.plat.outputs.platforms }} |"
          } >> "$GITHUB_STEP_SUMMARY"
