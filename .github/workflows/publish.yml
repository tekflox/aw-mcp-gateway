name: Publish gateway image

# Builds the gateway server (back/) and pushes it to ghcr.io/<owner>/aw-mcp-gateway.
# Uses GHCR_PAT when configured so the workflow can update an existing org
# package that was first published outside this repo; otherwise falls back to
# the workflow-scoped GITHUB_TOKEN. Two ways in:
#
#   - workflow_dispatch: manual run, amd64-only by default.
#   - workflow_call: release.yml's `publish` job calls this automatically,
#     BEFORE the version bump + marketplace sync, whenever a push to `main`
#     touches anything under back/ — that is literally this Dockerfile's
#     whole build context (`COPY . .`), so any file under back/ changes the
#     image; front/ and connector/ are built by build.yml but never reach
#     this image at all (see release.yml's `changed-paths` job, keep the
#     two in sync). A docs/metadata-only push never reaches this job, so
#     it never pays for a build. Always amd64-only on the automatic path —
#     QEMU arm64 emulation measured ~8x slower on this runner (run
#     36450565287, 2026-09-28: 11m with arm64 vs. this same workflow's own
#     ~80s amd64-only baseline) — manual runs can still opt in below.
#
#   gh workflow run publish.yml                        # amd64
#   gh workflow run publish.yml -f include_arm64=true  # + linux/arm64 (QEMU)
on:
  workflow_dispatch:
    inputs:
      include_arm64:
        description: 'Also build linux/arm64 (QEMU emulation; slower)'
        type: boolean
        default: false
  workflow_call:
    inputs:
      include_arm64:
        description: 'Also build linux/arm64 (QEMU emulation; slower)'
        type: boolean
        default: false

concurrency:
  group: publish-aw-mcp-gateway-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: aw-mcp-gateway
    runs-on: [self-hosted, aw-baremetal]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT || secrets.GITHUB_TOKEN }}

      # ghcr.io rejects mixed-case namespaces — lowercase the owner login.
      - name: Lowercase repo owner
        id: owner
        run: echo "lc=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Resolve platforms
        id: plat
        run: |
          if [ "${{ inputs.include_arm64 }}" = "true" ]; then
            echo "platforms=linux/amd64,linux/arm64" >> "$GITHUB_OUTPUT"
          else
            echo "platforms=linux/amd64" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: back
          file: back/Dockerfile
          platforms: ${{ steps.plat.outputs.platforms }}
          push: true
          tags: |
            ghcr.io/${{ steps.owner.outputs.lc }}/aw-mcp-gateway:latest
            ghcr.io/${{ steps.owner.outputs.lc }}/aw-mcp-gateway:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Agentic Workspace MCP Gateway
            org.opencontainers.image.licenses=MIT
          cache-from: type=registry,ref=ghcr.io/${{ steps.owner.outputs.lc }}/aw-mcp-gateway:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ steps.owner.outputs.lc }}/aw-mcp-gateway:buildcache,mode=max

      - name: Summary
        run: |
          {
            echo "## 🐳 aw-mcp-gateway pushed"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| **Image** | \`ghcr.io/${{ steps.owner.outputs.lc }}/aw-mcp-gateway:latest\` |"
            echo "| **Platforms** | ${{ steps.plat.outputs.platforms }} |"
          } >> "$GITHUB_STEP_SUMMARY"
